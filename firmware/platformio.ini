; ARC-Slate / ARC-Clock firmware – ESP32-S3-DevKitC-1 (N16R8) on the ARC_AP board.
; Two apps share one chip (partitions_16mb_dual.csv): ota_0 = slate, ota_1 = clock.
;   pio run -e slate -t upload     first time: bootloader, partition table and the slate app (ota_0)
;   pio run -e clock -t upload     only the clock app (ota_1); the boot selection stays untouched
; Switching: menu entry, hold the encoder button at power-on, or serial "mode clock|slate".
; Pin map: src/common/pins.h, wiring: ../hardware/wiring/ARC-Slate_Verdrahtung.svg

[env]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = partitions_16mb_dual.csv
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi     ; N16R8: octal PSRAM
build_flags =
    -DCONFIG_LWIP_IPV6=1
    -DARC_FW_VERSION=\"2.1.0-dev\"
    -DBOARD_HAS_PSRAM
    -Isrc/common
lib_ignore = QNEthernet
lib_deps =
    ; ARC-Core: local checkout next to this repo during development.
    ; Release builds: https://github.com/probstj03/ARC-Core.git#vX.Y.Z
    symlink://../../ARC-Core
    adafruit/RTClib @ ^2.1.3
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
    bblanchon/ArduinoJson @ ^7.0.4
    zinggjm/GxEPD2 @ ^1.6.0

[env:slate]
build_src_filter = +<common/> +<slate/>
build_flags =
    ${env.build_flags}
    -DARC_APP_SLATE

[env:clock]
build_src_filter = +<common/> +<clock/>
build_flags =
    ${env.build_flags}
    -DARC_APP_CLOCK
board_upload.offset_address = 0x410000
extra_scripts = post:tools/clock_upload.py
